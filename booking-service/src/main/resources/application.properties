spring.application.name=booking-service

server.port=8082

# Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/arena_booking_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Security Context Validation Key
jwt.secret=${JWT_SECRET}

# External Service URLs (Load Balanced)
auth.service.wallet.deduct.url=http://AUTH-SERVICE/api/auth/profile/wallet/deduct
auth.service.wallet.refund.url=http://AUTH-SERVICE/api/auth/profile/wallet/refund

# Eureka Client Configuration
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.preferIpAddress=true
spring.cloud.compatibility-verifier.enabled=false
# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.walletDeduction.slidingWindowSize=10
resilience4j.circuitbreaker.instances.walletDeduction.failureRateThreshold=50
resilience4j.circuitbreaker.instances.walletDeduction.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.walletDeduction.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.walletDeduction.automaticTransitionFromOpenToHalfOpenEnabled=true


wallet.service.key=${WALLET_SERVICE_KEY}
